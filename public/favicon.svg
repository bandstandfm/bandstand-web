<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rounded-square background -->
  <rect width="1024" height="1024" rx="192" ry="192" fill="#0A0C10"/>
  
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#F4D77A"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A6831F"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="60%" stop-color="#0A0C10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>


  <!-- Faint gold ring — survives down to 32px and reads as a premium frame -->
  <rect x="32" y="32" width="960" height="960" rx="170" ry="170"
        fill="none" stroke="#D4AF37" stroke-width="14" opacity="0.32"/>

  <rect width="1024" height="1024" rx="192" ry="192" fill="url(#vignette)"/>

  <!-- Bebas Neue B — at favicon-tab sizes (16-32px) the narrow strokes
       of Bebas read cleaner than a serif. -->
  <text x="512" y="820"
        font-family="Bebas Neue, Impact, 'Arial Narrow Bold', sans-serif"
        font-weight="400" font-size="980"
        text-anchor="middle" fill="url(#goldShine)"
        letter-spacing="0">B</text>

  <!-- Eighth note grace mark — kept as the recognizable signature. -->
  <g fill="#D4AF37" opacity="0.88">
    <circle cx="780" cy="270" r="34"/>
    <rect x="806" y="160" width="20" height="120" rx="6"/>
    <path d="M 806 160 Q 886 180 866 252 L 866 200 Q 842 190 826 206 Z" opacity="0.75"/>
  </g>
</svg>